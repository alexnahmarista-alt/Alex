<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Iniciar sesión · Castillos Frozen Foods</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/styles.css">
</head>
<body class="login-body">
  <div class="login-card">
    <div class="login-brand">
      <div class="wave">🦐</div>
      <div>
        <h1>Castillos Frozen Foods</h1>
        <p>Frescura y calidad que enamoran</p>
      </div>
    </div>

    <h2 class="section-title">Iniciar sesión</h2>
    <form id="loginForm">
      <div class="field">
        <label for="username">Usuario</label>
        <input id="username" name="username" autocomplete="username" required>
      </div>
      <div class="field">
        <label for="password">Contraseña</label>
        <input id="password" name="password" type="password" autocomplete="current-password" required>
      </div>
      <p id="loginError" class="login-error" style="display:none;"></p>
      <button class="btn btn-accent" type="submit" style="width:100%;">Entrar</button>
    </form>
  </div>

  <div class="toast" id="toast"></div>

  <script src="js/api.js"></script>
  <script src="js/login.js"></script>
</body>
</html>
